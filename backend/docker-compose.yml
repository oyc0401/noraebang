version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: noraebang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noraebang
      POSTGRES_PASSWORD: noraebang123
      POSTGRES_DB: song_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noraebang"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
